<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pulse – rejestracja</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Fraunces:opsz,wght@9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#1F150C; --field:#412D15; --text:#E1DCC9; --muted:#A89A85;
    --caramel:#E2BFA0; --espresso:#3A2A22; --rust:#7A3B2A; --cream:#F7EFE6;
    --err:#E8957C; --ok:#A9C79B;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; background:#140D07; }
  body { min-height:100vh; display:flex; justify-content:center; font-family:Manrope, sans-serif; color:var(--text); }
  .screen { width:100%; max-width:430px; min-height:100vh; background:var(--bg); display:flex; flex-direction:column; }

  .hero { height:250px; flex-shrink:0; background:var(--caramel); border-radius:0 0 40px 40px;
          display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; padding-top:34px; }
  .logo { display:flex; align-items:flex-start; font-family:Fraunces, serif; font-weight:600; font-size:60px;
          line-height:1.233; letter-spacing:-0.03em; color:var(--espresso); }
  .logo svg { width:.5em; height:1.233em; margin:0 -0.035em 0 -0.05em; }
  .tagline { margin:0; font-size:15px; font-weight:600; color:var(--espresso); }

  /* --- Animacja wejścia --- */
  .screen { overflow:hidden; }
  .hero { height:290px; margin-top:-40px; padding-top:74px; animation:heroDrop .9s cubic-bezier(.22,1.25,.36,1) both; }
  .logo span { animation:fadeIn .5s ease-out .55s both; }
  .pulse-line { stroke-dasharray:1; stroke-dashoffset:1; animation:draw .7s cubic-bezier(.65,0,.35,1) .8s forwards; }
  .logo svg { overflow:visible; }
  .logo svg .dot { transform-origin:46px 115px; transform:scale(0); animation:pop .35s ease-out 1.45s forwards; }
  .tagline { animation:fadeUp .5s ease-out 1.2s both; }
  form > * { animation:fadeUp .45s ease-out both; }
  form > *:nth-child(1){animation-delay:1.0s} form > *:nth-child(2){animation-delay:1.06s}
  form > *:nth-child(3){animation-delay:1.12s} form > *:nth-child(4){animation-delay:1.18s}
  form > *:nth-child(5){animation-delay:1.24s} form > *:nth-child(6){animation-delay:1.3s}
  form > *:nth-child(n+7){animation-delay:1.36s}
  @keyframes heroDrop { from { transform:translateY(-105%); } to { transform:translateY(0); } }
  @keyframes draw { to { stroke-dashoffset:0; } }
  @keyframes pop { 60% { transform:scale(1.5); } to { transform:scale(0); } }
  @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
  @keyframes fadeUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:none; } }

  form { flex-grow:1; padding:28px 24px 40px; display:flex; flex-direction:column; gap:14px; }
  h1 { margin:0 0 2px; font-family:'Bricolage Grotesque', sans-serif; font-weight:700; font-size:26px; }
  label { display:flex; flex-direction:column; gap:6px; font-size:12px; font-weight:600; color:var(--muted); }
  input { background:var(--field); border:2px solid transparent; border-radius:14px; padding:13px 14px;
          font:inherit; font-size:15px; color:var(--text); outline:none; transition:border-color .15s; }
  input::placeholder { color:var(--muted); }
  input:focus { border-color:var(--caramel); }
  input.bad { border-color:var(--err); }

  button { margin-top:6px; background:var(--caramel); color:var(--bg); border:0; border-radius:16px; padding:17px;
           font:inherit; font-size:16px; font-weight:700; cursor:pointer; transition:transform .1s, opacity .15s; }
  button:hover { background:var(--cream); }
  button:active { transform:scale(.98); }
  button:disabled { opacity:.6; cursor:wait; }

  .msg { display:none; border-radius:14px; padding:12px 14px; font-size:14px; font-weight:600; }
  .msg.err { display:block; background:rgba(232,149,124,.12); color:var(--err); }
  .msg.ok  { display:block; background:rgba(169,199,155,.12); color:var(--ok); }
  details { font-size:12px; color:var(--muted); }
  details pre { margin:6px 0 0; white-space:pre-wrap; font-size:12px; }

  .spacer { flex-grow:1; }
  .bottom { margin:0; text-align:center; font-size:13px; color:var(--muted); }
  a { color:var(--caramel); font-weight:700; text-decoration:none; }
  a:hover { color:var(--cream); }
</style>
</head>
<body>
<div class="screen">
  <div class="hero">
    <div class="logo" role="img" aria-label="pulse">
      <span>pu</span><svg aria-hidden="true" viewBox="0 0 60 148"><path class="pulse-line" pathLength="1" d="M0 115H14L26 26L38 140L46 115H60" fill="none" stroke="#7A3B2A" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/><circle class="dot" cx="60" cy="115" r="9" fill="#7A3B2A"/></svg><span>se</span>
    </div>
    <p class="tagline">Załóż konto i zacznij mierzyć.</p>
  </div>

  <form id="form" novalidate>
    <h1>Nowe konto</h1>
    <label>Imię
      <input id="name" type="text" placeholder="Jonasz" autocomplete="given-name">
    </label>
    <label>E-mail
      <input id="email" type="email" placeholder="jonasz@przyklad.pl" autocomplete="email">
    </label>
    <label>Hasło
      <input id="password" type="password" placeholder="Co najmniej 8 znaków" autocomplete="new-password">
    </label>
    <label>Powtórz hasło
      <input id="password2" type="password" placeholder="••••••••" autocomplete="new-password">
    </label>

    <button id="btn" type="submit">Załóż konto</button>
    <div class="msg" id="msg"></div>
    <details id="debug" hidden>
      <summary>Odpowiedź serwera (podgląd dla programisty)</summary>
      <pre id="debugText"></pre>
    </details>

    <div class="spacer"></div>
    <p class="bottom">Masz już konto? <a href="#" title="Ekran logowania dojdzie razem z POST /login">Zaloguj się</a></p>
  </form>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  const form = $('form'), msg = $('msg'), btn = $('btn');

  function show(type, text) { msg.className = 'msg ' + type; msg.textContent = text; }
  function debug(status, data) {
    $('debug').hidden = false;
    $('debugText').textContent = 'Status: ' + status + '\n' + JSON.stringify(data, null, 2);
  }

  form.addEventListener('input', (e) => e.target.classList.remove('bad'));

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = $('name').value.trim();
    const email = $('email').value.trim();
    const password = $('password').value;
    const password2 = $('password2').value;

    // Sprawdzenie w przeglądarce = wygoda użytkownika. Serwer i tak sprawdza po swojemu!
    if (password !== password2) {
      $('password2').classList.add('bad');
      return show('err', 'Hasła nie są takie same');
    }

    btn.disabled = true;
    try {
      const res = await fetch('/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email, password })
      });
      let data = null;
      try { data = await res.json(); } catch {}
      debug(res.status, data);

      if (res.ok) {
        show('ok', 'Konto założone! Witaj w Pulse, ' + name + ' 👋');
        form.reset();
      } else if (res.status === 409) {
        $('email').classList.add('bad');
        show('err', 'Ten e-mail ma już konto.');
      } else {
        show('err', (data && data.error) || 'Coś poszło nie tak');
      }
    } catch (err) {
      show('err', 'Nie mogę połączyć się z serwerem. Czy działa node server.js?');
    } finally {
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
